server {
    listen 80;
    listen [::]:80;
    server_name arsant.web.id www.arsant.web.id;

    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        try_files $uri =404;
    }

    location / {
        return 301 https://arsant.web.id$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.arsant.web.id;

    ssl_certificate     /etc/letsencrypt/live/arsant.web.id/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/arsant.web.id/privkey.pem;

    return 301 https://arsant.web.id$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name arsant.web.id;

    server_tokens off;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    ssl_certificate     /etc/letsencrypt/live/arsant.web.id/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/arsant.web.id/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 32M;

    root /srv/arsant-screener/web;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        try_files $uri =404;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:4000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 300s;
    }

    # Workspace lama sudah digantikan Arsant Trade. Pertahankan pengalihan
    # permanen agar bookmark dan tautan lama tidak berakhir di halaman kosong.
    location = /app {
        return 301 /trade;
    }

    location ^~ /app/ {
        return 301 /trade;
    }

    location ~* \.(?:css|js|png|jpg|jpeg|svg|webp|woff|woff2)$ {
        try_files $uri =404;
        expires 7d;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
