# Arsant API storefront on arsant.my.id
# Issue the certificate for both names before enabling the TLS server block:
# certbot certonly --nginx -d arsant.my.id -d www.arsant.my.id

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name arsant.my.id www.arsant.my.id;

    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        try_files $uri =404;
    }

    location / {
        return 301 https://arsant.my.id$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.arsant.my.id;

    ssl_certificate     /etc/letsencrypt/live/arsant.my.id/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/arsant.my.id/privkey.pem;

    return 301 https://arsant.my.id$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name arsant.my.id;

    ssl_certificate     /etc/letsencrypt/live/arsant.my.id/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/arsant.my.id/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 32M;

    root /srv/arsant-screener/web;
    index index.html;

    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        try_files $uri =404;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:4000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 300s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
